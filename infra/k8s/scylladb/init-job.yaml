apiVersion: batch/v1
kind: Job
metadata:
  name: scylla-init
  namespace: mercury
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-scylla
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z scylladb.mercury.svc 9042; do sleep 5; done"]
      containers:
        - name: init
          image: scylladb/scylla:6.2
          command: ["cqlsh", "scylladb.mercury.svc", "9042", "-f", "/scripts/init.cql"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: scylla-init
