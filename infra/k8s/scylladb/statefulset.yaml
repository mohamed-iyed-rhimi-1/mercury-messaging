apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: scylladb
  namespace: mercury
spec:
  serviceName: scylladb
  replicas: 1
  selector:
    matchLabels:
      app: scylladb
  template:
    metadata:
      labels:
        app: scylladb
    spec:
      containers:
        - name: scylladb
          image: scylladb/scylla:6.0
          args: ["--smp", "1", "--memory", "512M", "--overprovisioned", "1"]
          ports:
            - containerPort: 9042
              name: cql
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["cqlsh", "-e", "SELECT now() FROM system.local"]
            periodSeconds: 10
            failureThreshold: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/scylla
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: scylladb
  namespace: mercury
spec:
  clusterIP: None
  selector:
    app: scylladb
  ports:
    - port: 9042
      name: cql
