apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: mercury
  labels:
    app: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: gateway
          image: mercury/gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: PORT
              value: "4000"
            - name: PHX_HOST
              value: "gateway.mercury.svc"
            - name: SCYLLA_NODES
              value: "scylladb.mercury.svc:9042"
            - name: NATS_URL
              value: "nats://nats.mercury.svc:4222"
            - name: DRAGONFLY_URL
              value: "redis://:mercury@dragonfly.mercury.svc:6379"
            - name: REDPANDA_HOST
              value: "redpanda.mercury.svc"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mercury-secrets
                  key: DATABASE_URL
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: mercury-secrets
                  key: SECRET_KEY_BASE
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mercury-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 2
