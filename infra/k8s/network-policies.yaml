# Default deny all ingress in mercury namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: mercury
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Allow gateway to reach all backends
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-backends
  namespace: mercury
spec:
  podSelector:
    matchLabels:
      app: gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: scylladb
        - podSelector:
            matchLabels:
              app: postgresql
        - podSelector:
            matchLabels:
              app: nats
        - podSelector:
            matchLabels:
              app: dragonfly
        - podSelector:
            matchLabels:
              app: redpanda
---
# Allow ingress to gateway from anywhere (external traffic)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-gateway
  namespace: mercury
spec:
  podSelector:
    matchLabels:
      app: gateway
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 4000
---
# Allow ScyllaDB inter-node communication and gateway access
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-scylla-internal
  namespace: mercury
spec:
  podSelector:
    matchLabels:
      app: scylladb
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: scylladb
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - port: 9042
---
# Allow external access to Grafana (NodePort)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-grafana
  namespace: mercury
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 3000
---
# Allow Grafana to reach datasources
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-egress
  namespace: mercury
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: prometheus
        - podSelector:
            matchLabels:
              app: loki
        - podSelector:
            matchLabels:
              app: tempo
---
# Allow Prometheus to scrape all pods in namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: mercury
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
---
# Allow Prometheus egress (scrape targets + kube-api)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-egress
  namespace: mercury
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
    - Egress
  egress:
    - {}
---
# Allow backends to accept connections from gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backends-from-gateway
  namespace: mercury
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [postgresql, nats, dragonfly, redpanda]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
