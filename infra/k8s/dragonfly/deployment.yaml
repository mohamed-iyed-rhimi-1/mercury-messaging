apiVersion: apps/v1
kind: Deployment
metadata:
  name: dragonfly
  namespace: mercury
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dragonfly
  template:
    metadata:
      labels:
        app: dragonfly
    spec:
      containers:
        - name: dragonfly
          image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
          args: ["--requirepass", "mercury"]
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "-a", "mercury", "ping"]
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dragonfly
  namespace: mercury
spec:
  selector:
    app: dragonfly
  ports:
    - port: 6379
      name: redis
