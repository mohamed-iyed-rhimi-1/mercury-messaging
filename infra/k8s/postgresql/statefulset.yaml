apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: mercury
spec:
  serviceName: postgresql
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
        - name: postgresql
          image: citusdata/citus:12.1
          env:
            - name: POSTGRES_USER
              value: mercury
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mercury-secrets
                  key: DRAGONFLY_PASSWORD
            - name: POSTGRES_DB
              value: mercury_dev
          ports:
            - containerPort: 5432
              name: pg
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "mercury", "-d", "mercury_dev"]
            periodSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: pg-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: mercury
spec:
  clusterIP: None
  selector:
    app: postgresql
  ports:
    - port: 5432
      name: pg
