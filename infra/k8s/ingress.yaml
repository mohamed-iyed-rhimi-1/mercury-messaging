apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  namespace: mercury
  annotations:
    # Traefik (k3s built-in) WebSocket support
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/custom-request-headers: "Connection: Upgrade"
spec:
  rules:
    - host: mercury.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 4000
